[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sana-hub"
version = "0.1.0"
description = "AI Sana business challenge readiness hub"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
sana = "app.launcher:main"

[tool.setuptools.packages.find]
include = ["app*", "engines*", "bench*"]

[tool.setuptools.package-data]
"engines.light" = ["prompts/*.md"]
"engines.heavy" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
